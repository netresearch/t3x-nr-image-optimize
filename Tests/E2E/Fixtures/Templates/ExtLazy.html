{namespace nrio=Netresearch\NrImageOptimize\ViewHelpers}
<f:comment>Benchmark page: nrio:sourceSet with native lazy loading.</f:comment>
<f:for each="{images -> f:split(separator: ',')}" as="i">
<div class="photo"><nrio:sourceSet path="/fileadmin/benchmark/photo-{i}.jpg" width="800" height="600" lazyload="1" alt="Photo {i}" /></div>
</f:for>
