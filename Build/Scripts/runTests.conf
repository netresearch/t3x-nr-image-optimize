# shellcheck shell=bash
# Per-extension settings for the shared test runner.
#
# The Processor requires the imagick PHP extension. The upstream
# core-testing images ship GD but NOT imagick, so a plain run skips
# SystemRequirementsServiceTest::checkImagickReturnsVersionAndFormatsWhenLoaded
# and every functional test that constructs the Processor would fail on
# "Imagick PHP extension must be installed to use this driver".
#
# CI gets imagick from setup-php via the php-extensions input in ci.yml. This
# gives local runs the same environment, which is the entire reason this
# repository carried a 463-line runner fork until netresearch/typo3-ci-workflows
# v1.8.0 made the image nameable.
#
# The image is derived, not vendored: one cache-friendly RUN layer on top of
# whichever core-testing image the requested PHP version resolves to. The build
# writes to stderr, because this function's stdout IS the image name.
php_image() {
    local version="${1}"
    local base tag
    base="ghcr.io/typo3/core-testing-php${version//./}:latest"
    tag="nr-image-optimize-testing-php${version}:latest"

    if ! docker image inspect "${tag}" >/dev/null 2>&1; then
        echo "runTests.conf: building ${tag} (adding imagick on top of ${base})..." >&2
        docker build --quiet --tag "${tag}" - >&2 <<DOCKERFILE
FROM ${base}
RUN set -eux; \\
    apk add --no-cache --virtual .build-deps \$PHPIZE_DEPS imagemagick-dev pkgconf; \\
    pecl install imagick; \\
    docker-php-ext-enable imagick; \\
    apk del --no-network .build-deps
DOCKERFILE
    fi

    printf '%s' "${tag}"
}
